version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./main.py:/app/main.py  # Mount updated main.py
      - ./snapshots:/app/snapshots
      - ./config:/app/config
      - ./testfiles:/app/testfiles
      - ./jsnapy.cfg:/etc/jsnapy/jsnapy.cfg
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - JNOS_DEVICE_IP=${JNOS_DEVICE_IP:-127.0.0.1}
      - JNOS_USERNAME=${JNOS_USERNAME:-admin}
      - JNOS_PASSWORD=${JNOS_PASSWORD:-manolis1}
      - JNOS_TEST_FILE=${JNOS_TEST_FILE:-test_version.yaml}
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  automation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app/backend
      - ./snapshots:/app/snapshots
      - ./config:/app/config
      - ./testfiles:/app/testfiles
      - ./jsnapy.cfg:/etc/jsnapy/jsnapy.cfg
    environment:
      - JNOS_DEVICE_IP=${JNOS_DEVICE_IP:-127.0.0.1}
      - JNOS_USERNAME=${JNOS_USERNAME:-admin}
      - JNOS_PASSWORD=${JNOS_PASSWORD:-manolis1}
      - JNOS_TEST_FILE=${JNOS_TEST_FILE:-test_version.yaml}
    # Container needs direct network access for NETCONF connections
    network_mode: host
    # Keep container running for docker exec commands
    command: tail -f /dev/null
    restart: unless-stopped
