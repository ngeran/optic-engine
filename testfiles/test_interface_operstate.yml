tests_include:
  - test_interface_operstate
  # use '/' in your test cases apart from xpath if u want to search all elements irrespective of hierarchy,
  # ex: in id if u use /name instead of name
  # then it will search in all the names in given xpath irrespective of their position

# for simple, one test using command
test_interface_operstate:
  - command: show interfaces terse
  - iterate:
      xpath: physical-interface[contains(name, "-")]
      id: './name'
      tests:
        - no-diff: oper-status  # element in which test is performed
          err: "Test Failed!! oper-status got changed for <{{post['name']}}>, before it was <{{pre['oper-status']}}>, now it is <{{post['oper-status']}}> with name <{{id_0}}> and admin status <{{post['admin-status']}}>"
          info: "Test succeeded!! oper-status is same for <{{post['name']}}> with value, before it is <{{pre['oper-status']}}> now it is <{{post['oper-status']}}> with admin status <{{post['admin-status']}}>"

test_route_summary:
  tests_include:
    - check_route_summary
  check_route_summary:
    - command: show route summary
    - iterate:
        xpath: //route-summary-information/route-table
        id: ./table-name
        tests:
          - delta: active-route-count, 20%
            info: "Test Succeeded!! Active route for routing table <{{post['table-name']}}> has changed within delta 20%, before it was <{{pre['active-route-count']}}>, now it is <{{post['active-route-count']}}>"
            err: "Test Failed!!! Active route for routing table <{{post['table-name']}}> has changed more than delta 20%, before it was <{{pre['active-route-count']}}>, now it is <{{post['active-route-count']}}>"